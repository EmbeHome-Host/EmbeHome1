name = "embehome-website"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# Route production domain to Worker (site + /api). Remove embehome.in from Pages custom domains.
[[routes]]
pattern = "embehome.in/*"
zone_name = "embehome.in"

[[routes]]
pattern = "www.embehome.in/*"
zone_name = "embehome.in"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "embehome_enquiries"
database_id = "6360577f-8e6a-4778-94e6-64d176e3747e"
remote = true

# Admin login credentials are stored in D1 table: admin_users
# Set secret via: wrangler secret put ADMIN_API_TOKEN
